<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>Trove</title>
  <!-- Trove's mark: the wordmark's tilted ink square, on paper so it reads on dark tab bars too. -->
  <rect width="32" height="32" rx="6" fill="#FAFAF7"/>
  <rect x="8" y="8" width="16" height="16" fill="#111111" transform="rotate(-6 16 16)"/>
</svg>
