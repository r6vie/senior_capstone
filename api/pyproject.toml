[project]
name = "trove-api"
version = "0.1.0"
description = "The Trove backend: FastAPI, MongoDB and Claude."
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.6.0",
    "certifi>=2026.10.23",
    "email-validator>=2.3.0",
    "fastapi>=0.162.0",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.2",
    "pymongo>=4.19.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "SIM", "RUF"]
ignore = [
    "B008",  # FastAPI's Depends(...) in argument defaults is the documented pattern
    "E501",  # the formatter handles line length; long strings are left alone
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
